<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Усі елементи форми · Лабораторна №7</title>
  <link rel="stylesheet" href="assets/style.css">
  <script defer src="assets/forms.js"></script>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">ЛАБОРАТОРНА РОБОТА №7 · ГРЕБЕНЮК ІВАН · 305-ТН</p>
    <nav aria-label="Навігація"><a href="index.html">Усі завдання</a></nav>
  </header>
  <h2>Усі елементи форми</h2>
  <p>Реєстрація на практикум із веброзробки. Форма показує текстове поле, пароль, багато­рядковий текст, списки, прапорці, радіокнопки, вибір файлу й три типи кнопок.</p>
  <form class="form" action="FormAccepted.html" method="post" data-demo>
    <label class="field">Ваше ім’я
      <input type="text" name="name" maxlength="40" autocomplete="name" required>
    </label>
    <label class="field">Демонстраційний пароль
      <input type="password" name="password" minlength="4" maxlength="20" autocomplete="off" placeholder="Вигаданий пароль">
    </label>
    <label class="field">Напрям навчання
      <select name="track"><option value="web">Веброзробка</option><option value="graphics">Комп’ютерна графіка</option><option value="testing">Тестування</option></select>
    </label>
    <label class="field">Дні для консультацій (можна вибрати кілька)
      <select name="days" multiple size="4"><option value="mon">Понеділок</option><option value="tue">Вівторок</option><option value="wed">Середа</option><option value="fri">П’ятниця</option></select>
    </label>
    <fieldset>
      <legend>Навички</legend>
      <label class="choice"><input type="checkbox" name="skill" value="html"> HTML</label>
      <label class="choice"><input type="checkbox" name="skill" value="css"> CSS</label>
      <label class="choice"><input type="checkbox" name="skill" value="js"> JavaScript</label>
    </fieldset>
    <fieldset>
      <legend>Формат занять</legend>
      <label class="choice"><input type="radio" name="format" value="online" checked> Онлайн</label>
      <label class="choice"><input type="radio" name="format" value="classroom"> В аудиторії</label>
    </fieldset>
    <label class="field">Коментар
      <textarea name="comment" rows="4" cols="50"></textarea>
    </label>
    <label class="field">Додатковий файл
      <input type="file" name="attachment" accept=".pdf,.txt,.png">
    </label>
    <div class="actions">
      <input type="reset" value="Очистити форму">
      <input type="submit" value="Відіслати дані">
      <input type="button" id="today-button" value="Показати сьогоднішню дату">
    </div>
    <div role="status"></div>
  </form>
</main>
</body>
</html>
